{% load render_partial %}
{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}فروشگاه{% endblock %}</title>

    <!-- استایل‌های مشترک -->
    <link rel="stylesheet" href="{% static 'base-s/header.css' %}">
    <link rel="stylesheet" href="{% static 'base-s/footer.css' %}" />

    {% block head %}{% endblock %}
</head>
<body>
    {% render_partial 'header' %}

    {% block content %}{% endblock %}

    {% render_partial 'footer' %}

    {% block script %}{% endblock %}
</body>
</html>
